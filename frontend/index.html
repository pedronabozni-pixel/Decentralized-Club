<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBZ Wealth — Acesso</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A0A0A'/%3E%3Cpolygon points='32,7 51,37 32,58 13,37' fill='none' stroke='%23C9A961' stroke-width='2.5'/%3E%3Cpolygon points='32,22 45,37 32,50 19,37' fill='%23C9A961'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="auth-screen">
    <div class="auth-grain"></div>
    <div class="auth-vignette"></div>

    <div class="auth-wrap">
      <div class="auth-brand">
        <svg class="nbz-mark" width="46" height="46" viewBox="0 0 54 54" xmlns="http://www.w3.org/2000/svg" aria-label="NBZ">
          <polygon points="27,0 54,32 27,54 0,32"/>
          <polygon class="facet" points="27,19 40,32 27,45 14,32"/>
        </svg>
        <div class="word">NBZ</div>
        <div class="sub">Wealth</div>
      </div>

      <div class="auth-ornament">
        <span class="hairline l"></span>
        <span class="diamond"></span>
        <span class="hairline r"></span>
      </div>

      <div class="auth-card">
        <div class="auth-tabs">
          <div class="auth-tab active" data-tab="login">Entrar</div>
          <div class="auth-tab" data-tab="register">Criar conta</div>
        </div>

        <!-- Login -->
        <form id="loginForm">
          <div class="field">
            <label for="loginEmail">E-mail</label>
            <input class="input" type="email" id="loginEmail" placeholder="voce@email.com" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="loginPassword">Senha</label>
            <div class="password-field">
              <input class="input" type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Mostrar senha">Mostrar</button>
            </div>
          </div>
          <button class="btn btn-gold w-full" type="submit" style="padding:14px 0;">Acessar plataforma</button>
        </form>

        <!-- Registro -->
        <form id="registerForm" class="hidden">
          <div class="field">
            <label for="regName">Nome</label>
            <input class="input" type="text" id="regName" placeholder="Seu nome" autocomplete="name" />
          </div>
          <div class="field">
            <label for="regEmail">E-mail</label>
            <input class="input" type="email" id="regEmail" placeholder="voce@email.com" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="regPassword">Senha</label>
            <div class="password-field">
              <input class="input" type="password" id="regPassword" placeholder="Min. 8 caracteres" autocomplete="new-password" required />
              <button type="button" class="password-toggle" data-target="regPassword" aria-label="Mostrar senha">Mostrar</button>
            </div>
            <div class="help">Use ao menos 8 caracteres.</div>
          </div>
          <button class="btn btn-gold w-full" type="submit" style="padding:14px 0;">Criar conta</button>
        </form>
      </div>

      <div class="auth-foot">NBZ Ecosystem · Gestao de patrimonio</div>
    </div>
  </main>

  <script src="/js/api-client.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
