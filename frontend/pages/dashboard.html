<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Decentralized Club</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0A0A'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%23C9A961' text-anchor='middle'%3ED.%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/charts.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <div class="page-head">
        <div>
          <div class="eyebrow">Visao geral</div>
          <h1>Dashboard</h1>
        </div>
        <div class="meta" id="marketMeta">Carregando mercado…</div>
      </div>

      <!-- KPIs -->
      <div id="kpis">
        <div class="kpi-hero"><div class="label">Patrimonio total</div><div class="hero-value skeleton">000000000</div></div>
        <div class="kpi-stack">
          <div class="kpi-row"><div class="label">Ganho/Perda do dia</div><span class="val skeleton">00000</span></div>
          <div class="kpi-row"><div class="label">Ganho/Perda total</div><span class="val skeleton">00000</span></div>
          <div class="kpi-row"><div class="label">Total investido</div><span class="val skeleton">00000</span></div>
        </div>
      </div>

      <!-- Evolucao + Distribuicao -->
      <div class="grid split-wide mt-lg">
        <div class="card chart-card pad-lg">
          <div class="chart-head">
            <h3>Evolucao do patrimonio</h3>
            <div class="range-tabs" id="rangeTabs">
              <div class="range-tab" data-days="7">7D</div>
              <div class="range-tab active" data-days="30">30D</div>
              <div class="range-tab" data-days="90">90D</div>
            </div>
          </div>
          <div class="chart-box h-tall"><canvas id="evolutionChart"></canvas></div>
        </div>

        <div class="card chart-card pad-lg">
          <div class="chart-head"><h3>Distribuicao</h3></div>
          <div class="chart-box h-pie"><canvas id="allocChart"></canvas></div>
          <div id="allocLegend" style="margin-top:20px;"></div>
        </div>
      </div>

      <!-- Posicoes resumidas + comparativo -->
      <div class="grid split-wide mt-lg">
        <div class="card pad-lg">
          <div class="section-title" style="margin:0 0 14px;">
            <h2 style="font-size:1.25rem;">Principais posicoes</h2>
            <a class="hint text-gold" href="criptomoedas.html">Ver todas →</a>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Ativo</th><th class="num">Preco medio</th><th class="num">Atual</th><th class="num">Ganho/Perda</th></tr>
              </thead>
              <tbody id="topPositions"></tbody>
            </table>
          </div>
        </div>

        <div class="card chart-card pad-lg">
          <div class="chart-head"><h3>Cripto vs Renda Fixa</h3></div>
          <div class="chart-box h-mid"><canvas id="compareChart"></canvas></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/js/api-client.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/realtime.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
